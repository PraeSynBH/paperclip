version: 2
updates:
  # npm dependencies — weekly security and version updates
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Chicago"
    # Raise pull requests for both security and version updates
    open-pull-requests-limit: 10
    # Group all updates into a single PR to reduce noise
    groups:
      all-dependencies:
        patterns:
          - "*"
    # Labels for PRs
    labels:
      - "dependencies"
      - "security"
    # Auto-merge patch updates after CI passes
    # (disabled by default — enable after team review)
    # reviewers:
    #   - "rambur/security-engineering"

  # GitHub Actions — weekly updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Chicago"
    labels:
      - "dependencies"
      - "ci"