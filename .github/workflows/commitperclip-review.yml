name: commitperclip PR Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

# Always runs from base branch context — never executes PR code.
# pull_request_target gives access to secrets for untrusted fork PRs.

permissions:
  pull-requests: write
  checks: write
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # The bot key is a repository secret. On a fork it is usually absent, and
      # a job that fails on the missing key reddens every pull request without
      # saying anything about the change (PRX-6120 D3). The gate steps below
      # run only when the key exists; otherwise the job states that the review
      # gate is not configured here and passes.
      COMMITPERCLIP_KEY: ${{ secrets.COMMITPERCLIP_KEY }}
    steps:
      - name: Checkout base branch (never PR code)
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: master

      # Dependency Review is removed, deliberately (PRX-6120 D3).
      #
      # It failed on every pull request with:
      #   Dependency review is not supported on this repository.
      #   Please ensure that Dependency graph is enabled.
      # This repository is a fork, and GitHub starts a new fork with the
      # dependency graph disabled. The setting is not writable through the
      # REST API (a PATCH of security_and_analysis.dependency_graph is
      # silently ignored on a public repository), so the job could only ever
      # be red here — a permanent red says nothing about the pull request,
      # which is the problem this issue is about.
      #
      # To bring the gate back: enable Dependency graph at
      # https://github.com/PraeSynBH/paperclip/settings/security_analysis
      # (admin, web UI only), confirm a dependency-change PR produces a real
      # verdict, then restore this step:
      #
      #   - name: Dependency Review
      #     uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
      #     with:
      #       base-ref: ${{ github.event.pull_request.base.sha }}
      #       head-ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'

      - name: Report an unconfigured review gate
        if: env.COMMITPERCLIP_KEY == ''
        run: |
          echo "::warning title=commitperclip review gate not configured::$COMMITPERCLIP_KEY is not set in this repository. The quality gates did not run. Set the COMMITPERCLIP_KEY secret to enable them."
          {
            echo "### commitperclip review gate not configured"
            echo
            echo "This repository has no \`COMMITPERCLIP_KEY\` secret, so the quality gates did not run."
            echo "Set that secret to enable the gate. A missing secret is not a failed pull request,"
            echo "so this job reports the gap instead of a red check."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Generate commitperclip token
        id: token
        if: env.COMMITPERCLIP_KEY != ''
        run: |
          TOKEN=$(node .github/scripts/get-bot-token.mjs)
          echo "::add-mask::$TOKEN"
          echo "value=$TOKEN" >> $GITHUB_OUTPUT

      - name: Run quality gates
        id: quality
        if: env.COMMITPERCLIP_KEY != '' && github.event.pull_request.user.login != 'dependabot[bot]'
        run: node .github/scripts/run-quality-gates.mjs
        continue-on-error: true
        env:
          GH_TOKEN: ${{ steps.token.outputs.value }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_BRANCH: ${{ github.event.pull_request.head.ref }}

      - name: Fail if quality gates failed
        if: >-
          env.COMMITPERCLIP_KEY != '' &&
          github.event.pull_request.user.login != 'dependabot[bot]' &&
          steps.quality.outcome == 'failure'
        run: |
          echo "One or more quality gates failed. See commitperclip comment on the PR for details."
          exit 1
