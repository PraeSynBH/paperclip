name: PR
run-name: >-
  ${{ contains(github.event.pull_request.labels.*.name, 'profile-ci') && (github.event.action != 'labeled' || github.event.label.name == 'profile-ci') && format('CI profile · PR #{0}', github.event.pull_request.number) || '' }}

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

permissions:
  actions: read
  contents: read
  pull-requests: read

jobs:
  ci:
    if: github.event.action != 'labeled' || github.event.label.name == 'profile-ci'
    # This fork runs its OWN reusable workflow, not
    # paperclipai/paperclip/...@master, for three verified reasons (PRX-6120):
    #   1. The upstream copy requires artifacts this tree does not have
    #      (`server` `build:runtime`, a `dist-runtime` bundle), so `ci / Build`
    #      was red on every PR with exit 127.
    #   2. Its `verify` and `e2e` aggregators begin with
    #      `test "$POLICY_RESULT" = "success"`, so a single policy red printed
    #      two more reds over lane sets where every lane had passed.
    #   3. A defect there can only be fixed upstream, which leaves this
    #      repository with a permanently untruthful board.
    #
    # Trust note: caller and callee live in the same repository, so a pull
    # request that edits .github/workflows/** does change the CI that runs on
    # it. .github/** is CODEOWNERS-gated and this repository only accepts
    # reviewed commits; if it is ever opened to untrusted contributors, pin the
    # callee to a commit SHA on master and refresh it by PR.
    uses: ./.github/workflows/pr-trusted.yml
